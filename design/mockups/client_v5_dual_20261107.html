<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>研究工作台 v5 方案</title>
<style>
:root{
  --bg:#f6f7f9;--panel:#fff;--sunken:#f9fafb;--ink:#0f172a;--text:#334155;--muted:#64748b;--faint:#94a3b8;
  --line:#e5e7eb;--line2:#d1d5db;--accent:#1d4ed8;--accent2:#1e3a8a;--accentbg:#eff4ff;
  --obs:#2563eb;--obsbg:#eff6ff;--held:#047857;--heldbg:#ecfdf5;--int:#7c3aed;--intbg:#f5f3ff;--neg:#64748b;--negbg:#f1f5f9;--warn:#b45309;--warnbg:#fffbeb;
  --doc:#2563eb;--real:#ea580c;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.num{font-variant-numeric:tabular-nums}
/* 方案提示 */
.mock{background:#fffbeb;border-bottom:1px solid #fde68a;color:#92400e;font-size:12px;padding:5px 16px;text-align:center}
/* 应用框架 */
.app{display:grid;grid-template-rows:48px 1fr;height:calc(100vh - 28px)}
.appbar{display:flex;align-items:center;gap:12px;padding:0 14px;background:#fff;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:650;min-width:196px}
.brand i{width:24px;height:24px;border-radius:6px;background:var(--accent2);color:#fff;display:grid;place-items:center;font-style:normal;font-size:11px}
.search{flex:1;max-width:560px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--sunken);border-radius:8px;padding:5px 10px;color:var(--muted)}
.search input{border:0;background:none;outline:none;flex:1;color:var(--ink)}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted);background:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 10px;font-size:12px;white-space:nowrap}
.chip b{font-weight:600}
.spacer{flex:1}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text)}
.sw{width:28px;height:16px;border-radius:8px;background:var(--line2);position:relative}.sw:after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:.15s}
.toggle.on .sw{background:var(--accent)}.toggle.on .sw:after{left:14px}
.avatar{width:28px;height:28px;border-radius:50%;background:#e0e7ff;color:var(--accent2);display:grid;place-items:center;font-weight:600;font-size:12px}
.frame{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:0}
.side{background:#fff;border-right:1px solid var(--line);padding:10px 8px;overflow:auto}
.side h5{margin:14px 10px 4px;font-size:11px;font-weight:600;color:var(--faint);letter-spacing:.04em}
.side button{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:none;padding:6px 10px;border-radius:6px;color:var(--text);text-align:left}
.side button:hover{background:var(--sunken)}
.side button.on{background:var(--accentbg);color:var(--accent2);font-weight:600}
.side button small{color:var(--faint);font-size:11px;font-variant-numeric:tabular-nums}
.work{display:grid;grid-template-columns:minmax(0,1fr) auto;min-height:0}
.content{overflow:auto;padding:18px 24px 48px;min-width:0}
.inspector{width:0;overflow:hidden;background:#fff;border-left:1px solid var(--line);transition:width .18s}
.inspector.open{width:340px}
.inspector .in{width:340px;padding:16px;display:flex;flex-direction:column;gap:14px;height:100%;overflow:auto}
/* 页面头 */
.crumb{font-size:12px;color:var(--muted);margin-bottom:4px}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.ph h1{font-size:20px;font-weight:650;letter-spacing:-.01em}
.ph p{color:var(--text);margin-top:3px;max-width:780px}
.actions{display:flex;gap:8px}
.btn{border:1px solid var(--line2);background:#fff;border-radius:7px;padding:5px 11px;font-size:12px;color:var(--text)}
.btn:hover{background:var(--sunken)}
.btn.pri{background:var(--accent2);border-color:var(--accent2);color:#fff}
/* 面板 */
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.g12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;min-width:0}
.panel>header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.panel>header h3{font-size:13px;font-weight:600}
.panel>header .muted{font-size:12px}
.pb{padding:12px 14px}
.kpi{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.kpi .l{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.kpi .v{font-size:22px;font-weight:650;letter-spacing:-.01em}
.kpi .v small{font-size:13px;color:var(--muted);font-weight:500}
.kpi .d{font-size:12px;color:var(--muted)}
.stack{display:flex;height:6px;border-radius:3px;overflow:hidden;background:#eef0f3}.stack i{display:block;height:100%}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden}
.seg button{border:0;background:#fff;padding:4px 10px;font-size:12px;color:var(--text)}.seg button.on{background:var(--accent2);color:#fff}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tabs button{border:0;background:none;padding:7px 10px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent2);font-weight:600}
/* 证据徽章 */
.ev{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:1px 7px;border-radius:999px;white-space:nowrap;font-weight:500}
.ev:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.ev.obs{background:var(--obsbg);color:var(--obs)}.ev.held{background:var(--heldbg);color:var(--held)}.ev.int{background:var(--intbg);color:var(--int)}.ev.neg{background:var(--negbg);color:var(--neg)}.ev.warn{background:var(--warnbg);color:var(--warn)}
.ev.ok{background:var(--heldbg);color:var(--held)}.ev.no{background:var(--negbg);color:var(--neg)}
/* 表格 */
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:7px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;font-weight:600;color:var(--muted);background:var(--sunken);position:sticky;top:0}
tbody tr{cursor:pointer}tbody tr:hover td{background:#fafbfc}tbody tr.sel td{background:var(--accentbg)}
td.num,th.num{text-align:right}
td.mono{white-space:nowrap}
/* 主线轨道 */
.track{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.stg{border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:74px}
.stg .id{font-family:var(--mono);font-size:11px;color:var(--muted)}
.stg b{font-size:12px;font-weight:600;line-height:1.35}
.stg .bar{height:4px;border-radius:2px;background:#eef0f3;margin-top:auto;overflow:hidden}.stg .bar i{display:block;height:100%;background:var(--accent2)}
.stg.done{background:#f8fafc}.stg.done .bar i{background:var(--held)}
.stg.cur{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentbg)}
.stg.on{outline:2px solid var(--accent2)}
.gates{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.gates div{display:flex;gap:8px;align-items:center}
.ck{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:11px;color:#fff;flex:none}.ck.y{background:var(--held);border-color:var(--held)}
/* 热图 */
.heat{display:grid;gap:1px;background:var(--line)}
.heat i{display:block;aspect-ratio:1.6;cursor:pointer}
.heat i:hover{outline:2px solid var(--ink);outline-offset:-1px;position:relative;z-index:1}
.heat i.sel{outline:2px solid #f59e0b;outline-offset:-1px;position:relative;z-index:2}
.axis{font-size:10px;color:var(--faint);font-family:var(--mono)}
.scale{height:8px;border-radius:4px;width:160px}
/* 分面 */
.facet h4{font-size:11px;color:var(--muted);font-weight:600;margin:12px 0 6px;letter-spacing:.03em}
.facet label{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:13px}
.facet label span{flex:1}.facet label small{color:var(--faint);font-variant-numeric:tabular-nums}
/* 检查器 */
.ins-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ins-h h3{font-size:16px;font-weight:650}
.x{border:0;background:none;font-size:18px;color:var(--muted);line-height:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12px}.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right}
.hb{display:grid;grid-template-columns:56px 1fr 40px;gap:8px;align-items:center;font-size:12px}
.hb i{display:block;height:8px;background:#eef0f3;border-radius:4px;overflow:hidden}.hb i b{display:block;height:100%}
.ladder{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.ladder div{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-top:1px solid var(--line);font-size:12px}.ladder div:first-child{border-top:0}
.feed li{display:grid;grid-template-columns:52px auto 1fr;gap:10px;align-items:start;padding:9px 14px;border-top:1px solid var(--line)}
.feed li:first-child{border-top:0}
.feed{list-style:none;margin:0;padding:0}
.cov td{text-align:center}.cov td:first-child{text-align:left}
.cell{display:inline-block;min-width:54px;padding:2px 6px;border-radius:4px;font-size:12px}
.note{font-size:12px;color:var(--muted)}
.diff{margin-top:18px;border:1px dashed var(--line2);border-radius:10px;padding:10px 14px;background:#fff;font-size:12px;color:var(--text)}
.diff summary{cursor:pointer;color:var(--muted)}.diff ul{margin:6px 0 0;padding-left:18px}
.chart svg{display:block;width:100%;height:auto}
.small-mult{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.small-mult div{border:1px solid var(--line);border-radius:8px;padding:8px}
.small-mult svg{width:100%;height:40px;display:block}
.obj-h{display:flex;gap:14px;align-items:center}
.obj-h .badge{width:44px;height:44px;border-radius:10px;background:var(--accentbg);color:var(--accent2);display:grid;place-items:center;font-family:var(--mono);font-weight:700}
.strip{display:grid;grid-template-columns:repeat(36,1fr);gap:1px}
.strip i{height:22px;display:block;border-radius:1px}
body.learn .toggle,body.learn .chip.model{display:none}
.modes{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;margin-left:4px}
.modes button{border:0;background:#fff;padding:5px 12px;font-size:12px;color:var(--text)}.modes button.on{background:var(--accent2);color:#fff}
.hero{background:linear-gradient(135deg,#eff4ff,#fff 60%);border:1px solid var(--line);border-radius:14px;padding:28px 28px 24px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:center}
.hero h1{font-size:26px;line-height:1.3;letter-spacing:-.01em}.hero p{font-size:14px;color:var(--text);margin-top:8px}
.hero .cta{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn.lg{padding:9px 18px;font-size:14px;border-radius:9px}
.path{border:1px solid var(--line);border-radius:12px;background:#fff;padding:18px;display:flex;flex-direction:column;gap:8px;text-align:left}
.path:hover{border-color:var(--accent);box-shadow:0 2px 10px rgba(29,78,216,.08)}
.path .ic{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-size:18px}
.path h3{font-size:16px}.path ul{margin:0;padding-left:18px;color:var(--text)}
.stepper{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stepbox{border:1px solid var(--line);border-radius:12px;padding:16px;background:#fff;display:flex;flex-direction:column;gap:6px}
.stepbox .n{width:26px;height:26px;border-radius:50%;background:var(--accent2);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
.req{display:flex;flex-direction:column;gap:8px}
.req div{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;font-size:13px}
.req .ok{color:var(--held);font-weight:700}.req .q{color:var(--warn);font-weight:700}
.lesson{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px}
.lnav{display:flex;flex-direction:column;gap:4px}
.lnav button{border:1px solid transparent;background:none;text-align:left;padding:8px 10px;border-radius:8px;color:var(--text);display:flex;gap:8px;align-items:center}
.lnav button span{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:11px;flex:none}
.lnav button.on{background:var(--accentbg);color:var(--accent2);font-weight:600}.lnav button.on span{background:var(--accent2);border-color:var(--accent2);color:#fff}
.lnav button.done span{background:var(--held);border-color:var(--held);color:#fff}
.tok{display:flex;flex-wrap:wrap;gap:3px;font-size:14px}.tok span{border:1px solid var(--line);border-radius:5px;padding:2px 6px;background:#fff}
.tok span.k{background:#eff6ff;border-color:#bfdbfe}.tok span.a{background:#fff7ed;border-color:#fed7aa}
.bigbar{display:grid;grid-template-columns:80px 1fr 60px;gap:10px;align-items:center;margin:6px 0}
.bigbar i{display:block;height:16px;background:#eef0f3;border-radius:8px;position:relative;overflow:hidden}.bigbar i:after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:#94a3b8}
.bigbar i b{position:absolute;top:0;bottom:0;border-radius:8px}
.callout{border-left:3px solid var(--accent2);background:var(--sunken);padding:10px 14px;border-radius:0 8px 8px 0;font-size:13px}
.teach{display:inline-block;font-size:11px;color:#92400e;background:#fffbeb;border:1px solid #fde68a;border-radius:6px;padding:0 6px}
.faq details{border-top:1px solid var(--line);padding:10px 14px}.faq details:first-child{border-top:0}.faq summary{cursor:pointer;font-weight:600}.faq p{margin-top:6px;color:var(--text)}
.empty{text-align:center;padding:30px 16px;color:var(--muted)}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g21,.g12,.g3{grid-template-columns:1fr}.track{grid-template-columns:repeat(4,minmax(0,1fr))}.small-mult{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){.hero{grid-template-columns:1fr}.stepper{grid-template-columns:1fr}.lesson{grid-template-columns:1fr}.lnav{flex-direction:row;overflow-x:auto}.lnav button{white-space:nowrap}}
@media (max-width:760px){.modes button{padding:5px 8px}
  .app{height:auto}.frame{grid-template-columns:1fr}.side{display:flex;overflow-x:auto;padding:6px;border-right:0;border-bottom:1px solid var(--line)}.side h5{display:none}.side button{width:auto;white-space:nowrap}.side button small{display:none}
  .brand{min-width:0}.brand span,.chip.model,.toggle,.kbd{display:none}.search{min-width:0}.search input{min-width:0;width:100%}.appbar{gap:8px}.content{padding:14px 16px 40px}.g4{grid-template-columns:1fr 1fr}
  .work{grid-template-columns:1fr}.inspector.open{width:100%}.inspector .in{width:100%}
  .track{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>
<body>
<div class="mock">第五版方案草图 · 两类用户两条路：普通人学习与贡献算力，专业人员看研究进展 · 数字均为真实数据；下载、登录等操作在方案页不可用</div>
<div class="app">
  <header class="appbar">
    <div class="brand"><i>AI</i><span>AI2050</span></div><div class="modes" id="modes"><button data-m="learn">学习与参与</button><button data-m="pro">研究进展</button></div>
    <label class="search"><span>⌕</span><input id="q" placeholder="搜索语言项、层、头、神经元、规则、运行…  例如 L29H11、R-MLP-09、MA-H2"><span class="kbd">Ctrl K</span></label>
    <span class="spacer"></span>
    <span class="chip model">模型 <b>Qwen3-4B</b><span class="more mono muted">bf16 · 6be1034f</span> ▾</span>
    <span class="toggle" id="formal"><span class="sw"></span>只看正式证据</span>
    <span class="avatar">访</span>
  </header>
  <div class="frame">
    <nav class="side" id="side" aria-label="导航"></nav>
    <div class="work"><main class="content" id="content"></main><aside class="inspector" id="ins" aria-label="对象检查器"><div class="in" id="insIn"></div></aside></div>
  </div>
</div>

function line(series, { w = 760, h = 240, lo, hi, band, cursor, yfmt = v => v } = {}) {
  const m = { l: 40, r: 76, t: 10, b: 24 }, n = series[0].v.length;
  const all = series.flatMap(s => s.v); lo = lo ?? Math.min(...all); hi = hi ?? Math.max(...all);
  const X = i => m.l + i / (n - 1) * (w - m.l - m.r), Y = v => m.t + (hi - v) / (hi - lo) * (h - m.t - m.b);
  let s = `<svg viewBox="0 0 ${w} ${h}" role="img">`;
  if (band) s += `<rect x="${X(band[0])}" y="${m.t}" width="${X(band[1]) - X(band[0])}" height="${h - m.t - m.b}" fill="#f5f3ff"/><text x="${(X(band[0]) + X(band[1])) / 2}" y="${m.t + 12}" font-size="10" fill="#7c3aed" text-anchor="middle">${band[2] || ''}</text>`;
  const ticks = [lo, (lo + hi) / 2, hi].map(v => Math.round(v * 10) / 10); if (lo < 0 && hi > 0) ticks.push(0);
  [...new Set(ticks)].forEach(v => s += `<line x1="${m.l}" x2="${w - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="${v === 0 ? '#cbd5e1' : '#f1f5f9'}"/><text x="${m.l - 6}" y="${Y(v) + 3}" font-size="10" fill="#94a3b8" text-anchor="end">${yfmt(v)}</text>`);
  for (let i = 0; i < n; i += 6) s += `<text x="${X(i)}" y="${h - 6}" font-size="10" fill="#94a3b8" text-anchor="middle">${i}</text>`;
  series.forEach(se => { s += `<path d="${se.v.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ',' + Y(v).toFixed(1)).join('')}" fill="none" stroke="${se.c}" stroke-width="2"/><text x="${X(n - 1) + 6}" y="${Y(se.v[n - 1]) + 4}" font-size="11" fill="#334155">${se.n}</text>`; });
  if (cursor != null) { s += `<line x1="${X(cursor)}" x2="${X(cursor)}" y1="${m.t}" y2="${h - m.b}" stroke="#f59e0b"/>`; series.forEach(se => s += `<circle cx="${X(cursor)}" cy="${Y(se.v[cursor])}" r="3.5" fill="${se.c}" stroke="#fff" stroke-width="1.5"/>`); }
  for (let i = 0; i < n; i++) s += `<rect x="${X(i) - (w - m.l - m.r) / (n - 1) / 2}" y="${m.t}" width="${(w - m.l - m.r) / (n - 1)}" height="${h - m.t - m.b}" fill="transparent" data-l="${i}"><title>第 ${i} 层：${series.map(se => `${se.n} ${se.v[i].toFixed(2)}`).join('，')}</title></rect>`;
  return s + '</svg>';
}

document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); document.getElementById('q').focus(); } if (e.key === 'Escape') closeIns(); });
document.getElementById('q').addEventListener('keydown', e => { if (e.key !== 'Enter') return; const v = e.target.value.trim().toUpperCase(); const m = /^L(\d+)H(\d+)$/.exec(v);
  if (m) { go('enc'); encSel = `${+m[1]},${+m[2]}`; render(); openIns(headIns(+m[1], +m[2])); } else if (v.startsWith('R-')) { const i = D.rules.findIndex(r => r.id === v); if (i >= 0) { go('rules'); openIns(ruleIns(D.rules[i])); } } else if (v === 'MA-H2') go('assoc'); });
render();
</script>
