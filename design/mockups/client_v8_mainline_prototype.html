<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>客户端 v8 原型</title>
<style>
:root{--bg:#f8fafc;--panel:#fff;--sub:#f1f5f9;--bd:#e2e8f0;--bd2:#cbd5e1;--tx:#1e293b;--tx2:#475569;--tx3:#94a3b8;--blue:#0284c7;--mono:ui-monospace,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.5 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
button{font:inherit}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:0 16px;min-height:54px;background:#fff;border-bottom:1px solid var(--bd)}
.brand{display:flex;align-items:center;gap:8px}.logo{width:30px;height:30px;border-radius:8px;background:#184f95;color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
.brand b{display:block;font-size:13px}.brand small{display:block;font-size:10.5px;color:var(--tx3)}
.main-nav{display:flex;gap:4px}
.main-nav button{border:0;background:none;padding:16px 14px 14px;font-size:14px;color:var(--tx2);cursor:pointer;border-bottom:2px solid transparent;display:flex;gap:6px;align-items:center}
.main-nav button .n{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:99px;background:var(--sub);font-size:11px;font-weight:700}
.main-nav button.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}.main-nav button.on .n{background:var(--blue);color:#fff}
.right{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:6px 0}
.right select{font:inherit;font-size:12px;border:1px solid var(--bd2);border-radius:6px;padding:4px 8px;background:#fff}
.more{position:relative}.more>button{border:1px solid var(--bd2);background:#fff;border-radius:6px;padding:4px 10px;cursor:pointer;color:var(--tx2)}
.more ul{display:none;position:absolute;right:0;top:34px;background:#fff;border:1px solid var(--bd);border-radius:8px;list-style:none;margin:0;padding:6px;min-width:220px;box-shadow:0 8px 24px rgba(15,23,42,.12)}
.more.open ul{display:block}.more li{padding:6px 8px;border-radius:5px;font-size:12px}.more li small{display:block;color:var(--tx3);font-size:10.5px}
.proto{font-size:11px;border:1px dashed #f59e0b;color:#92400e;background:#fffbeb;border-radius:99px;padding:2px 9px}
.wrap{padding:14px 16px 40px}
.hidden{display:none!important}
.note{font-size:11px;color:var(--tx3);line-height:1.6;margin:6px 0 0}
.mock{border:1px dashed #f59e0b;background:#fffbeb;color:#92400e;border-radius:8px;padding:8px 10px;font-size:11.5px;margin-top:8px}
.card{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:14px 16px;min-width:0}
.card h3{margin:0 0 2px;font-size:14px;display:flex;align-items:center;gap:8px}.card h3 .k{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:#184f95;color:#fff;font-size:11px}
.card .q{color:var(--tx2);font-size:12px;margin:0 0 10px}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:600;border-radius:99px;padding:1px 8px;white-space:nowrap}
.chip.none{background:#fff;color:var(--tx3);border:1px dashed var(--bd2)}
.link{border:0;background:none;color:var(--blue);cursor:pointer;padding:0;font:inherit}
.mono{font-family:var(--mono)}
/* 主线 1 */
.lang{display:grid;grid-template-columns:250px minmax(0,1fr);gap:14px;align-items:start}
.side{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:10px;position:sticky;top:68px;max-height:calc(100vh - 84px);overflow:auto}
.bigcats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px}
.bigcats button{border:1px solid var(--bd);background:var(--sub);border-radius:8px;padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.bigcats button b{font-size:12.5px}.bigcats button small{font-size:10px;color:var(--tx3)}
.bigcats button.on{background:#184f95;border-color:#184f95;color:#fff}.bigcats button.on small{color:#cbd5e1}
.ext{width:100%;border:0;background:none;color:var(--tx3);font-size:11px;cursor:pointer;text-align:left;padding:4px 2px;margin-bottom:6px}
.fam{margin:8px 0 2px;font-size:11.5px;font-weight:600;color:var(--tx2);display:flex;justify-content:space-between}
.fam small{font-weight:400;color:var(--tx3)}
.itm{display:flex;gap:7px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:5px 8px;border-radius:6px;cursor:pointer;font-size:12.5px;color:var(--tx)}
.itm:hover{background:var(--sub)}.itm.on{background:#dbeafe;font-weight:600}.itm .s{width:14px;text-align:center}
.legend-lv{display:flex;flex-direction:column;gap:3px;margin-top:12px;border-top:1px solid var(--bd);padding-top:8px;font-size:11px;color:var(--tx2)}
.article{display:flex;flex-direction:column;gap:12px;min-width:0}
.ihead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ihead h2{margin:0;font-size:20px}.ihead .path{font-size:11.5px;color:var(--tx3)}
.ihead .st{display:flex;gap:6px;flex-wrap:wrap}
.toc{display:flex;gap:6px;flex-wrap:wrap}.toc a{font-size:11.5px;color:var(--tx2);text-decoration:none;border:1px solid var(--bd);border-radius:99px;padding:2px 9px;background:#fff}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairs .col{border:1px solid var(--bd);border-radius:8px;padding:8px 10px}
.pairs .col h4{margin:0 0 6px;font-size:12px;display:flex;gap:6px;align-items:center}
.pairs .sent{font-size:14px;padding:4px 0;border-bottom:1px dashed var(--bd)}.pairs .sent:last-child{border:0}
.hl{background:#fde68a;border-radius:3px;padding:0 2px}.ro{outline:2px solid #2a78d6;border-radius:3px;padding:0 2px}
.probe{border:1px solid var(--bd);border-radius:8px;padding:10px;background:var(--sub);font-size:13px}
.ans{display:inline-flex;gap:6px;margin-top:6px}.ans span{border-radius:6px;padding:2px 8px;font-size:12px}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px}
svg text{font-family:system-ui,sans-serif}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--tx2);margin-top:4px}.lg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.units{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.units li{display:flex;gap:8px;align-items:center;border:1px solid var(--bd);border-radius:6px;padding:5px 8px;font-size:12px}
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rules li{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--bd);border-radius:8px;padding:7px 9px;font-size:12px}
.axes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.axes>div{border:1px solid var(--bd);border-radius:8px;padding:6px 8px;display:flex;flex-direction:column;gap:3px;align-items:flex-start}.axes small{color:var(--tx3);font-size:10.5px}
/* 主线 2 */
.neu{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:14px;align-items:start}
.tower{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:10px;position:sticky;top:68px}
.tower canvas{display:block;width:100%;cursor:grab}
.seg{display:flex;gap:4px;flex-wrap:wrap}.seg button{border:1px solid var(--bd);background:#fff;border-radius:6px;padding:3px 8px;font-size:11.5px;cursor:pointer;color:var(--tx2)}.seg button.on{border-color:var(--blue);color:var(--blue);background:#eff6ff;font-weight:600}
.layerp{display:flex;flex-direction:column;gap:12px;min-width:0}
.block{display:flex;flex-direction:column;gap:4px;align-items:stretch}
.blk{display:flex;align-items:center;gap:10px;border:1px solid var(--bd2);border-radius:8px;padding:7px 10px;background:#fff;cursor:pointer;text-align:left}
.blk b{font-size:12.5px;min-width:96px}.blk span{font-size:11.5px;color:var(--tx2)}.blk em{margin-left:auto;font-style:normal;font-size:10.5px}
.blk.res{background:var(--sub);cursor:default;border-style:dashed}.blk.on{border-color:var(--blue);box-shadow:0 0 0 2px rgba(2,132,199,.15)}
.blk.plan em{color:var(--tx3)}.blk.has em{color:#15803d;font-weight:600}
.arrow{text-align:center;color:var(--tx3);font-size:11px;line-height:1}
.mlprow{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;align-items:start}
.gridwrap{position:relative;overflow-x:auto}.gridwrap canvas{display:block;image-rendering:pixelated;cursor:crosshair}
.tip{position:absolute;pointer-events:none;background:#0f172a;color:#f8fafc;font-size:11.5px;border-radius:7px;padding:6px 8px;max-width:240px;z-index:5;line-height:1.5}
.ucard{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;position:sticky;top:68px;max-height:calc(100vh - 84px);overflow:auto}
.ucard h4{margin:0;font-size:12px;color:var(--tx2)}
.ucard .id{font-size:15px;font-weight:600}
.expl{border-left:3px solid #184f95;padding:4px 8px;background:#f8fbff;font-size:12.5px}
.tok{display:inline-block;font-family:var(--mono);font-size:11px;border:1px solid var(--bd2);border-radius:4px;padding:0 4px;margin:2px 3px 0 0;background:#fff;white-space:pre}
.tok.up{border-color:#93c5fd;background:#eff6ff}.tok.dn{border-color:#fdba74;background:#fff7ed}
.ctx{font-size:11.5px;border-bottom:1px dashed var(--bd);padding:4px 0;word-break:break-all}.ctx b{background:#fde68a;border-radius:3px;padding:0 2px}
.ctx small{color:var(--tx3)}
@media (max-width:1280px){.mlprow{grid-template-columns:minmax(0,1fr)}.ucard{position:static;max-height:none}}
@media (max-width:980px){.lang,.neu,.two,.mlprow,.pairs{grid-template-columns:minmax(0,1fr)}.side,.tower,.ucard{position:static;max-height:none}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">A2</span><span><b>AI2050</b><small>LLM 语言编码研究</small></span></div>
  <nav class="main-nav" aria-label="主线">
    <button id="nav-lang" class="on" onclick="go('lang')"><span class="n">1</span>语言图谱</button>
    <button id="nav-neu" onclick="go('neu')"><span class="n">2</span>神经元</button>
  </nav>
  <div class="right">
    <span class="proto" title="真实数据片段来自 server.ai2050.com（2026-10-27）；虚线黄框是原型说明">原型 · 嵌入真实数据片段</span>
    <label style="font-size:11.5px;color:var(--tx3)">模型 <select disabled><option>qwen3-4b</option></select></label>
    <div class="more" id="more"><button onclick="document.getElementById('more').classList.toggle('open')">更多 ▾</button>
      <ul><li>进展<small>按大类的覆盖统计与研究缺口</small></li><li>参与<small>领题、一键包、贡献榜</small></li><li>本地包<small>研究包 / 谱图包浏览器内打开</small></li><li>工作台 ↗<small>模板、冻结、审计、普查（网页版）</small></li></ul></div>
  </div>
</header>

<div class="wrap">
<!-- ============ 主线 1：语言图谱 ============ -->
<section id="page-lang" class="lang">
  <aside class="side">
    <div class="bigcats" id="bigcats"></div>
    <button class="ext" id="extbtn" onclick="toggleExt()">＋ 扩展（语种、风格…）</button>
    <div id="tree"></div>
    <div class="legend-lv" id="lvlegend"></div>
  </aside>
  <main class="article" id="article"></main>
</section>

<!-- ============ 主线 2：神经元 ============ -->
<section id="page-neu" class="neu hidden">
  <aside class="tower">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
      <b style="font-size:13px">全部层 · qwen3-4b</b>
      <div class="seg" id="ovseg"></div>
    </div>
    <canvas id="tower" height="560"></canvas>
    <div class="lg" id="towerlg"></div>
    <p class="note">每块板 = 一个 Transformer 块（底部嵌入、顶部输出头）。颜色 = 所选叠加量（浅 → 深）。拖动旋转，点击选中一层。层板只是排列，不代表模型几何。</p>
  </aside>
  <main class="layerp" id="layerp"></main>
</section>
</div>

function lineChart(curves){

  for (let l = 0; l <= 36; l += 4) s += `<text x="${x(l)}" y="${H-12}" font-size="10" fill="#94a3b8" text-anchor="middle">${l === 0 ? 'hs[0]' : 'L' + l}</text>`;

const VIEW = {yaw:-0.5, pitch:0.26, zoom:1}; let towerHits = [];
const ovVal = b => st.overlay === 'sel' ? (selFinal[b] ? selFinal[b].n : 0) : st.overlay === 'expl' ? D.explained.filter(e => e[0] === b).length : 0;
function drawTower(){
  const cv = $('tower'), w = cv.clientWidth || 340, h = 560, dpr = window.devicePixelRatio || 1;
  cv.width = w * dpr; cv.height = h * dpr; const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
  const n = 38, H = 3.9, yOf = i => -H/2 + H * i / (n - 1), s = Math.min(w, h) * 0.27 * VIEW.zoom * (w < h ? 1.25 : 1);
  const P = (x, y, z) => { const cy = Math.cos(VIEW.yaw), sy = Math.sin(VIEW.yaw), cp = Math.cos(VIEW.pitch), sp = Math.sin(VIEW.pitch);
    const x1 = x*cy - z*sy, z1 = x*sy + z*cy, y2 = y*cp - z1*sp; return [w/2 + x1*s, h/2 - y2*s]; };
  const max = Math.max(1, ...Array.from({length:36}, (_, b) => ovVal(b))); towerHits = [];
  for (let i = 0; i < n; i++) {
    const y = yOf(i), b = i - 1, isB = i > 0 && i < n - 1, D2 = 0.55;
    const pts = [P(-1, y, -D2), P(1, y, -D2), P(1, y, D2), P(-1, y, D2)];
    ctx.beginPath(); pts.forEach(([a, c], k) => k ? ctx.lineTo(a, c) : ctx.moveTo(a, c)); ctx.closePath();
    const v = isB ? ovVal(b) : 0, sel = isB && b === st.block;
    ctx.fillStyle = !isB ? 'rgba(148,163,184,.25)' : st.overlay === 'none' ? 'rgba(241,245,249,.85)' : seq(0.05 + 0.95 * v / max);
    ctx.globalAlpha = 0.92; ctx.fill(); ctx.globalAlpha = 1;
    ctx.lineWidth = sel ? 2.4 : .8; ctx.strokeStyle = sel ? '#e34948' : '#94a3b8'; ctx.stroke();
    towerHits.push({b: isB ? b : null, pts, v, label: !isB ? (i === 0 ? '嵌入层' : '输出头（unembedding）') : `块 ${b}`});
    if (!isB || b % 5 === 0 || sel) { const lc = pts.slice().sort((a, c) => a[0] - c[0])[0]; ctx.font = `${sel ? 600 : 400} 10.5px system-ui`; ctx.fillStyle = sel ? '#e34948' : '#475569'; ctx.textAlign = 'right'; ctx.fillText(!isB ? (i === 0 ? '嵌入' : '输出头') : `块 ${b}`, lc[0] - 6, lc[1] + 3); }
  }
  towerHits.reverse();
  $('ovseg').innerHTML = [['sel', '疑问·选择性'], ['expl', '已解释'], ['none', '无']].map(([k, t]) => `<button class="${st.overlay === k ? 'on' : ''}" onclick="st.overlay='${k}';drawTower();renderLayer()">${t}</button>`).join('');
  $('towerlg').innerHTML = st.overlay === 'none' ? '' : `<span><i style="background:${seq(.1)}"></i>少</span><span><i style="background:${seq(1)}"></i>多（最多 ${max}）</span><span>${st.overlay === 'sel' ? '每块对疑问 / 陈述有选择性的单元数（句末读出）' : '每块已做解释检验的单元数（共 265）'}</span>`;
}
function inside(pt, pts){ let c = false; for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) { const [xi, yi] = pts[i], [xj, yj] = pts[j]; if ((yi > pt[1]) !== (yj > pt[1]) && pt[0] < (xj - xi) * (pt[1] - yi) / (yj - yi) + xi) c = !c; } return c; }
(function(){ const cv = $('tower'); let d = null;
  cv.addEventListener('mousedown', e => { d = {x:e.clientX, y:e.clientY, yaw:VIEW.yaw, pitch:VIEW.pitch, m:false}; });
  window.addEventListener('mouseup', e => { if (d && !d.m) { const r = cv.getBoundingClientRect(), h = towerHits.find(t => inside([e.clientX - r.left, e.clientY - r.top], t.pts)); if (h && h.b != null) { st.block = h.b; st.unit = null; drawTower(); renderLayer(); } } d = null; });
  window.addEventListener('mousemove', e => { if (!d) return; const dx = e.clientX - d.x, dy = e.clientY - d.y; if (Math.abs(dx) + Math.abs(dy) > 3) d.m = true; VIEW.yaw = d.yaw + dx*0.008; VIEW.pitch = Math.max(-1.2, Math.min(1.2, d.pitch + dy*0.008)); drawTower(); });
  cv.addEventListener('wheel', e => { e.preventDefault(); VIEW.zoom = Math.max(.5, Math.min(2.5, VIEW.zoom * (e.deltaY < 0 ? 1.1 : .91))); drawTower(); }, {passive:false});
})();

      <div class="gridwrap"><canvas id="ugrid" width="${cols*cell}" height="${rows*cell}" style="width:${cols*cell}px;height:${rows*cell}px"></canvas><div class="tip hidden" id="utip"></div></div>
      <div class="lg" id="ulg"></div>
      <div class="mock">原型只嵌入了：块 30 全部单元的类型、265 个已解释单元、每块选择性前 5 个单元。实现版由新端点 /api/neurons/layer 给出每块全部 9,728 个单元的激活密度、最大值、主导符号区与读出首 token，可按任一量着色与排序。</div></div>
      <div class="ucard" id="ucard"></div></div>`;
  }
  $('layerp').innerHTML = h;
  if (st.mod === 'mlp') { drawGrid(); renderCard(); }
}
function drawGrid(){
  const b = st.block, cols = 128, cell = 5, cv = $('ugrid'); if (!cv) return; const ctx = cv.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
  for (let u = 0; u < 9728; u++) { const c = unitColor(b, u) || '#eef2f7'; ctx.fillStyle = c; ctx.fillRect((u % cols) * cell, Math.floor(u / cols) * cell, cell - 1, cell - 1); }
  if (st.unit != null) { ctx.strokeStyle = '#e34948'; ctx.lineWidth = 2; ctx.strokeRect((st.unit % cols) * cell - 2, Math.floor(st.unit / cols) * cell - 2, cell + 3, cell + 3); }
  const lg = st.color === 'type' ? Object.entries(TYPE_NAME).map(([k, t]) => `<span><i style="background:${TYPE_COLOR[k]}"></i>${k} ${t}</span>`).join('')
    : st.color === 'expl' ? Object.entries(GRADE_COLOR).map(([k, c]) => `<span><i style="background:${c}"></i>${k}</span>`).join('') + '<span><i style="background:#eef2f7"></i>未做解释检验</span>'
    : `<span><i style="background:${CAT[0]}"></i>偏向疑问</span><span><i style="background:${CAT[1]}"></i>偏向陈述</span><span><i style="background:#eef2f7"></i>其他（原型只标每块前 5 个）</span>`;
  $('ulg').innerHTML = lg;
  const tip = $('utip');
  cv.onmousemove = e => { const r = cv.getBoundingClientRect(), u = Math.floor((e.clientY - r.top) / cell) * cols + Math.floor((e.clientX - r.left) / cell); if (u < 0 || u >= 9728) { tip.classList.add('hidden'); return; }
    const ex = explainedBy[`${b}:${u}`], ty = b === 30 && L30[u], se = selFinal[b] && selFinal[b].top.find(x => x[0] === u);
    tip.innerHTML = `<b>B${b}·U${u}</b>${ty ? `<br>${ty[1]} ${TYPE_NAME[ty[1]]} · 读出 ${esc(JSON.stringify(ty[2]))}` : ''}${ex ? `<br>${ex.g}：${esc((ex.e || '').slice(0, 60))}` : ''}${se ? `<br>疑问选择性 d = ${se[1]}` : ''}`;
    tip.style.left = Math.min(e.clientX - r.left + 12, cv.width - 200) + 'px'; tip.style.top = (e.clientY - r.top + 12) + 'px'; tip.classList.remove('hidden'); };
  cv.onmouseleave = () => tip.classList.add('hidden');
  cv.onclick = e => { const r = cv.getBoundingClientRect(), u = Math.floor((e.clientY - r.top) / cell) * cols + Math.floor((e.clientX - r.left) / cell); if (u >= 0 && u < 9728) { st.unit = u; drawGrid(); renderCard(); } };
}
function hist(hh){
  const reg = ['++', '--', '+-', '-+'], col = {'++':'#2a78d6', '--':'#7a3fbf', '+-':'#eb6834', '-+':'#1baf7a'}, n = hh.by_regime['++'].length;
  const tot = Array.from({length:n}, (_, i) => reg.reduce((s, r) => s + hh.by_regime[r][i], 0)); const lmax = Math.log10(Math.max(...tot) + 1);
  const W = 310, H = 110, bw = W / n; let s = `<svg viewBox="0 0 ${W} ${H + 16}" width="100%" role="img" aria-label="激活分布">`;
  for (let i = 0; i < n; i++) { let y = H; const hT = H * Math.log10(tot[i] + 1) / lmax;
    reg.forEach(r => { const v = hh.by_regime[r][i]; if (!v) return; const hh2 = hT * v / tot[i]; y -= hh2; s += `<rect x="${i*bw}" y="${y}" width="${bw - .5}" height="${hh2}" fill="${col[r]}"><title>${r}：${v.toLocaleString()} 个 token</title></rect>`; }); }
  s += `<line x1="${W/2}" x2="${W/2}" y1="0" y2="${H}" stroke="#475569" stroke-dasharray="2 2"/><text x="${W/2}" y="${H+12}" font-size="9.5" fill="#64748b" text-anchor="middle">0</text><text x="2" y="${H+12}" font-size="9.5" fill="#64748b">−${hh.hi}</text><text x="${W-2}" y="${H+12}" font-size="9.5" fill="#64748b" text-anchor="end">+${hh.hi}</text></svg>`;
  return s + `<div class="lg">${reg.map(r => `<span><i style="background:${col[r]}"></i>${r}（G${r[0]} V${r[1]}）</span>`).join('')}</div><p class="note" style="margin:2px 0 0">横轴 symlog，纵轴 log（token 数）；1,900 万 token 自然语料。</p>`;
}
function ctxRow(p){ return `<div class="ctx"><small>${esc(p.source)} · A=${p.a.toFixed(1)} · ${p.regime}</small><br>…${esc(p.left.slice(-70))}<b>${esc(p.hit)}</b>${esc(p.right.slice(0, 40))}…</div>`; }
function renderCard(){
  const el = $('ucard'); if (!el) return; const b = st.block, u = st.unit;
  if (u == null) { el.innerHTML = `<h4>单元卡</h4><p class="q">在左边阵列里点一个神经元。</p><p class="note">有完整真实单元卡的两个：<button class="link" onclick="go('neu',{block:23,unit:7489})">B23·U7489</button>（疑问选择性最强）、<button class="link" onclick="go('neu',{block:18,unit:1472})">B18·U1472</button>（已解释）。</p>`; return; }
  const c = D.cards.find(x => x.layer === b && x.unit === u), ex = explainedBy[`${b}:${u}`], ty = b === 30 && L30[u], se = selFinal[b] && selFinal[b].top.find(x => x[0] === u);
  let h = `<div><h4>单元卡</h4><div class="id mono">块 ${b} · 单元 ${u}</div><p class="note" style="margin:0">MLP 中间单元（SwiGLU，A = silu(G)⊙V），不是残差流坐标 · qwen3-4b</p></div>`;
  const exps = c ? (c.explanations || []) : [];
  h += `<div><h4>它在做什么（解释）</h4>${exps.length ? exps.map(x => `<div class="expl">${esc(x.explanation)}<br><small style="color:var(--tx3)">${x.run} · 置信 ${x.confidence} · 文本检验 ${x.text_outcome} · 语料检索 ${x.retrieval || '—'}</small></div>`).join('')
    : ex ? `<div class="expl">${esc(ex.e)}<br><small style="color:var(--tx3)">${ex.g}</small></div>` : '<p class="note" style="margin:0">还没有做解释检验。</p>'}</div>`;
  if (ty) h += `<div><h4>类型（块 30 分型）</h4><span class="chip" style="background:${TYPE_COLOR[ty[1]]};color:#fff">${ty[1]} ${TYPE_NAME[ty[1]]}</span> <span class="note">读出首 token <span class="tok">${esc(ty[2])}</span>（${esc(ty[3] || '')}）</span></div>`;
  if (c) {
    h += `<div><h4>激活分布</h4>${hist(c.hist)}<p class="note" style="margin:2px 0 0">强激活（> 最大值 10%）${c.fire_rate.gt_10pct_max.per_page}；均值 ${c.stats.mean.toFixed(3)}，最大 ${c.stats.max.toFixed(1)}。</p></div>`;
    h += `<div><h4>激活最强的上下文（正极前 4）</h4>${(c.poles.pos || []).map(ctxRow).join('')}</div>`;
    h += `<div><h4>激活最负的上下文（负极前 4）</h4>${(c.poles.neg || []).map(ctxRow).join('')}</div>`;
    h += `<div><h4>直接读出（推高 / 压低的 token）</h4>${c.readout.promotes.map(t => `<span class="tok up">${esc(t)}</span>`).join('')}<br>${c.readout.suppresses.map(t => `<span class="tok dn">${esc(t)}</span>`).join('')}<p class="note" style="margin:2px 0 0">${esc(c.readout.note)}</p></div>`;
    h += `<div><h4>对应的语言特征</h4>${(c.template_selectivity || []).map(t => { const item = FACTOR_ITEM[`${t.tm_id}:${t.factor}`]; const nm = item ? itemOf(item).name : t.tm_id;
      return `<div class="ctx">${item ? `<button class="link" onclick="go('lang',{item:'${item}',type:'${itemOf(item).type}'})">${esc(nm)} →</button>` : esc(nm)} <small>${esc(t.tm_id)} · ${esc(t.factor)} · ${esc(t.readout)} 读出 · ${t.in_top_lists ? '在选择性前列' : '有记录，未进前列'}</small></div>`; }).join('') || '<p class="note">没有模板选择性记录。</p>'}</div>`;
    h += `<div><h4>证据（三轴分开）</h4><div class="ctx">读出：${esc(c.evidence_axes.read)}<br>控制：${esc(c.evidence_axes.control)}<br>解释：${esc(c.evidence_axes.explain)}</div><p class="note">${(c.caveats || []).map(esc).join('；')}</p></div>`;
  } else {
    if (se) h += `<div><h4>对应的语言特征</h4><div class="ctx"><button class="link" onclick="go('lang',{item:'GR.Q',type:'GR'})">疑问 / 陈述 →</button> <small>句末读出 · d = ${se[1]} · 偏向${se[2] === 'interrog' ? '疑问' : '陈述'}</small></div></div>`;
    h += `<div class="mock">原型只嵌入了 2 张完整单元卡。实现版点任一单元都读取 /api/neurons/unit：激活分布、正负极上下文、直接读出、模板选择性、因果检验与解释。</div>`;
  }
  el.innerHTML = h;
}

function render(){
  if (st.page === 'lang') { renderSide(); renderArticle(); }
  else { drawTower(); renderLayer(); }
}
document.addEventListener('click', e => { const m = $('more'); if (!m.contains(e.target)) m.classList.remove('open'); });
window.addEventListener('resize', () => { if (st.page === 'neu') drawTower(); });
render();
</script>
