.hmgrid.wide{grid-template-columns:minmax(0,1fr) 360px}.orbit{width:100%;display:block;cursor:grab;touch-action:pan-y;background:radial-gradient(ellipse at 50% 45%,#fbfcfe,#f3f6fa);border-radius:9px;margin-top:8px;user-select:none}.orbit:active{cursor:grabbing}.orbit .gn{cursor:pointer}.orbit polygon[data-em]{cursor:pointer}
.ctx{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 12px;margin-bottom:14px;font-size:12px}.ctxgo{display:flex;align-items:center;gap:5px;margin-left:auto;flex-wrap:wrap}.ctxgo .btn{padding:3px 9px;font-size:12px}
.toolrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.toolrow .grow{flex:1;display:flex;align-items:center;gap:8px;min-width:180px}.toolrow input[type=range]{flex:1;min-width:0}

.lg{display:inline-block;width:11px!important;height:11px!important;border-radius:50%!important}.lg.full{background:#68748a}.lg.hollow{background:#fff;border:2px solid #68748a}.lg.dash{background:#fff;border:2px dashed #68748a}
.hgrid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px;margin-top:8px}.hcell{border:1px solid transparent;border-radius:4px;padding:5px 0;font-size:11px;font-family:var(--mono)}.hcell.sel{outline:2px solid #172033}
.barrow{display:grid;grid-template-columns:42px minmax(0,1fr) 42px;gap:8px;align-items:center;font-size:12px;margin-top:5px}.bar{height:8px;background:#eef1f5;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;border-radius:4px}.barrow .mono{text-align:right}
.verdict{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.verdict .card{border-top:3px solid var(--blue)}.verdict ul{margin:6px 0 0;padding-left:16px;font-size:12px;color:var(--text)}

.gap4 td:nth-child(4){white-space:nowrap}.gates{list-style:none;padding:0;margin:6px 0 0;display:grid;gap:4px;font-size:12px}.gates li{display:flex;align-items:center;gap:7px}.gates .box{width:13px;height:13px;border:1.5px solid var(--line2);border-radius:3px;flex:none}
.prow{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px}.pt{font-size:12px;color:var(--muted);font-weight:650}.hero{font-size:46px;font-weight:750;line-height:1.15;color:var(--blue2);font-variant-numeric:tabular-nums}
.pbar{height:8px;background:#e9edf3;border-radius:4px;overflow:hidden;margin-top:5px}.pbar i{display:block;height:100%;background:var(--blue);border-radius:4px}
.ptiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.ptile{display:flex;flex-direction:column;align-items:stretch;gap:2px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px;box-shadow:var(--shadow);min-width:0}button.ptile:hover{border-color:var(--line2)}.ptile.on{border-color:var(--blue)}.pv{font-size:26px;font-weight:720;line-height:1.25;color:var(--blue2);font-variant-numeric:tabular-nums}.pv.muted{color:var(--muted)}.pn{font-size:11px;color:var(--muted);margin-top:4px}.pv2{font-size:30px;font-weight:720;color:var(--blue2);font-variant-numeric:tabular-nums;line-height:1.2}
.hseg{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;margin-top:10px}.hseg button{border:1px dashed var(--line2);background:#f7f8fa;border-radius:6px;padding:5px 0;font-size:11px;font-family:var(--mono);color:var(--muted)}.hseg button.next{border:1.5px solid var(--blue);background:var(--bluebg);color:var(--blue2)}.hseg button.on{outline:2px solid var(--blue2)}
.btn.big{padding:10px 20px;font-size:15px;font-weight:650}.btn.full{width:100%}.jk{margin-top:10px;grid-template-columns:40px minmax(0,1fr)}.linkbtn{border:0;background:none;color:var(--blue);padding:0;font-size:12px;text-decoration:underline}
.folds{margin-top:16px;display:grid;gap:6px}.fold{background:#fff;border:1px solid var(--line);border-radius:10px}.fold summary{cursor:pointer;padding:9px 14px;font-size:13px;color:var(--text)}.fold[open] summary{border-bottom:1px solid var(--line)}.foldb{padding:12px 14px}
.qrow{display:grid;grid-template-columns:170px minmax(0,1fr) 56px;gap:10px;align-items:center;font-size:12px;margin-top:8px}.qrow .mono{text-align:right}.qrow .pbar{margin-top:0}
.steps{display:grid;grid-template-columns:repeat(8,minmax(106px,1fr));gap:6px;min-width:880px}.steps>div{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 10px}.steps>div.next{border:1.5px solid var(--blue);background:var(--bluebg)}.steps b{display:block;font-size:12px;line-height:1.35}.steps small{display:block;font-size:11px;color:var(--text);margin-top:3px;line-height:1.45}

<body>
<header class="top">
  <div class="brand"><span class="mark">A2</span><span><b>AI2050 · 客户端优化方案</b><small>依据 ResearchPlan v5、v6 · 空间三图修订</small></span></div>
  <div class="switch" role="group" aria-label="内容详略"><button id="mSimple" class="on">简明</button><button id="mPro">专业</button></div>
  <div class="switch" role="group" aria-label="批注"><button id="aOn" class="on">显示批注</button><button id="aOff">隐藏批注</button></div>
</header>
<div class="reviewbar"><b>静态方案稿</b> · 未修改真实客户端 · 未连接接口 · 确认后才开始改动</div>
<div class="shell">
  <nav class="rail" id="rail" aria-label="页面导航"></nav>
  <main class="main"><div id="sub"></div><div id="page"></div>
    <footer class="footer"><span>方案稿 2026-11-07</span><span>绿色标签：项目已有结果</span><span>橙色标签：界面示例，数值不是实验结果</span><span>虚线标签：未测</span></footer>
  </main>
</div>
<div id="tip" role="status"></div>
<script>
const NAV=[['plan','方案说明','★'],['audit','流程与对标','✓'],null,['route','进展','01'],['spatial','空间','02'],['process','研发','03'],['config','配置','04']];
const SUBS={route:[['overview','总览'],['rules','成果与证据']],spatial:[['lang','语言图谱'],['enc','LLM 编码图谱'],['assoc','关联机制']],process:[['current','当前研发'],['catalog','材料与数据'],['execution','实验与队列']]};
let S={lens:'plan',sub:'',cell:null,pair:0,card:'style',filter:'全部',hl:26,hp:10,hf:'diff',hv:'raw',sit:0,node:'apple',lm:'hand',lzone:'全部',lfocus:false,el:30,em:'mlp',eh:0,al:30,arm:'obs',am:'hm',playing:false,pd:null,hs:null,join:'idle',jscene:'ready',jp:0};
const $=s=>document.querySelector(s);
const FACT=[['lang','语言','var(--f-lang)'],['style','风格与体裁','var(--f-style)'],['logic','上下文逻辑','var(--f-logic)'],['gram','语法与符号','var(--f-gram)']];
const real=t=>`<span class="tag real">${t||'项目已有结果'}</span>`,demo=t=>`<span class="tag demo">${t||'界面示例'}</span>`,none=t=>`<span class="tag none">${t||'未测'}</span>`;
const band=t=>`<div class="demoband"><b>界面示例</b><span>${t||'用来确认版式，数值由固定函数生成，不是实验结果。'}</span></div>`;
const anno=(b,t)=>`<div class="anno"><b>批注 · ${b}</b> ${t}</div>`;
const head=(t,d)=>`<div class="pagehead"><h1>${t}</h1><p>${d}</p></div>`;
const sec=(t,d,body)=>`<section class="section"><div class="st"><h2>${t}</h2>${d?`<p>${d}</p>`:''}</div>${body}</section>`;
const table=(h,rows,cls='')=>`<div class="tablewrap"><table class="${cls}"><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

/* ---------- 方案说明 ---------- */
function plan(){return `
<div class="lead"><h1>让第三部分成为客户端的主线</h1>
<p>现在的客户端能看到语言目录、模型结构和连接数量，但看不到语言、风格、逻辑、语法怎样进入同一条 HiddenState 流，又怎样一起决定下一个词。本方案一级页面不变，空间改成语言图谱、LLM 编码图谱、关联机制三张图，其余二级页面不变。</p>

function hval(l,p0,f,v){const p=p0*1.8,g=(a,b,sa,sb)=>Math.exp(-((l-a)**2)/(2*sa*sa)-((p-b)**2)/(2*sb*sb));

 const k=v==='attr'?.8:v==='int'?1.1:1;return Math.max(-1,Math.min(1,(F[f]+n)*k));}

 let line='',up='',lo='',hits='';for(let i=0;i<=N;i++){const d=8*i/N,p=fn(d);line+=`${X(d).toFixed(1)},${Y(p).toFixed(1)} `;up+=`${X(d).toFixed(1)},${Y(Math.min(1,p+ci)).toFixed(1)} `;lo=`${X(d).toFixed(1)},${Y(Math.max(0,p-ci)).toFixed(1)} `+lo;hits+=`<rect x="${X(d)-5}" y="${y0}" width="10" height="${h}" fill="transparent" data-tip="强度 ${d.toFixed(1)} · A 胜比例 ${p.toFixed(2)}（示例）"/>`;}

 const r=t.closest('rect[data-l]');if(r){S.hl=+r.dataset.l;S.hp=+r.dataset.p;keep();return;}
 const ra=t.closest('rect[data-al]');if(ra){setLayer(+ra.dataset.al);return;}
 const pe=t.closest('polygon[data-em]');if(pe){S.el=+pe.dataset.el;S.em=pe.dataset.em;keep();return;}
 const gn=t.closest('[data-node]');if(gn){S.node=gn.dataset.node;keep();return;}
 if(!b)return;const d=b.dataset;
 if(d.lens)go(d.lens);else if(d.sub)go(S.lens,d.sub);else if(d.go){const[a,c]=d.go.split('/');go(a,c);}
 else if(d.cell){S.cell=d.cell;keep();}else if(d.filter){S.filter=d.filter;keep();}
 else if(d.layer){S.layers[d.layer]=!S.layers[d.layer];keep();}else if(d.hf){S.hf=d.hf;keep();}else if(d.hv){S.hv=d.hv;keep();}
 else if(d.lm){S.lm=d.lm;keep();}else if(d.lzone){S.lzone=d.lzone;S.lfocus=false;keep();}else if(d.lfocus){S.lfocus=!S.lfocus;keep();}
 else if(d.eh){S.eh=+d.eh;keep();}else if(d.arm){S.arm=d.arm;keep();}else if(d.am){S.am=d.am;keep();}
 else if(d.play){S.playing=!S.playing;b.textContent=S.playing?'暂停':'播放';clearInterval(timer);if(S.playing){if(S.al>=36)setLayer(0);timer=setInterval(()=>{if(S.sub!=='assoc'||S.al>=36){S.playing=false;clearInterval(timer);const p=$('#asPlay');if(p)p.textContent='播放';return;}setLayer(S.al+1);},220);}}
 else if(d.pd){S.pd=S.pd===d.pd?null:d.pd;keep();}else if(d.hs){S.hs=S.hs===+d.hs?null:+d.hs;keep();}
 else if(d.jscene){S.jscene=d.jscene;S.join='idle';clearInterval(joinT);keep();}else if(d.join)joinAct(d.join);
 else if(d.copy){b.textContent='链接已生成（示例）';}
 else if(d.sit){S.sit=+d.sit;keep();}else if(d.pair){S.pair=+d.pair;keep();}else if(d.card){S.card=d.card;keep();}});
const tip=$('#tip');document.addEventListener('mousemove',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(!t){tip.style.display='none';return;}tip.textContent=t.dataset.tip;tip.style.display='block';tip.style.left=Math.min(innerWidth-270,e.clientX+12)+'px';tip.style.top=(e.clientY+14)+'px';});
const tog=(a,b,fn)=>{$(a).onclick=()=>{$(a).classList.add('on');$(b).classList.remove('on');fn();};};
tog('#mSimple','#mPro',()=>document.body.classList.remove('pro-on'));tog('#mPro','#mSimple',()=>document.body.classList.add('pro-on'));
tog('#aOn','#aOff',()=>document.body.classList.remove('noanno'));tog('#aOff','#aOn',()=>document.body.classList.add('noanno'));
const OLD={structure:'enc',live:'assoc',response:'assoc'},h=location.hash.slice(1).split('/');if(PAGES[h[0]]){S.lens=h[0];S.sub=OLD[h[1]]||h[1]||(SUBS[h[0]]?SUBS[h[0]][0][0]:'');}
render();
</script>
</body>
</html>
