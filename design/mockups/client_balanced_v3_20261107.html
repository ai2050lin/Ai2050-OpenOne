<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工作台第三版方案</title>
<style>
:root{--bg:#f4f6f9;--panel:#fff;--soft:#f8fafc;--ink:#172033;--text:#3e4b60;--muted:#68748a;--line:#e2e7ef;--line2:#cbd5e2;--blue:#245ca8;--blue2:#183f77;--bluebg:#edf4fd;--green:#2f8f5b;--greenbg:#eaf6ef;--amber:#b07d00;--amberbg:#fff6e8;--red:#a33e43;--redbg:#fff0f0;--gray:#c3cbd8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.note{color:var(--muted);font-size:12px}
.bar{background:#fff8e9;border-bottom:1px solid #eeddb9;color:#6d4c14;padding:6px 20px;font-size:12px;text-align:center}
/* 外壳：左侧一级导航 + 顶部二级页签，与现有工作台一致 */
.shell{display:grid;grid-template-columns:64px minmax(0,1fr);min-height:calc(100vh - 32px)}
.rail{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:6px}
.rail .logo{width:34px;height:34px;border-radius:9px;background:var(--blue2);color:#fff;font-weight:700;display:grid;place-items:center;font-size:12px;margin-bottom:8px}
.rail button{border:0;background:none;width:52px;padding:6px 0;border-radius:10px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.rail button i{font-style:normal;font-size:16px}
.rail button.on{background:var(--bluebg);color:var(--blue2);font-weight:600}
.body{min-width:0;display:flex;flex-direction:column}
.tabs{background:#fff;border-bottom:1px solid var(--line);padding:0 24px;display:flex;gap:4px;overflow-x:auto}
.tabs button{border:0;background:none;padding:11px 12px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--blue2);border-bottom-color:var(--blue2);font-weight:600}
.main{padding:20px 24px 60px;display:flex;flex-direction:column;gap:14px;max-width:1240px;width:100%}
.head{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.head h2{font-size:20px}.head p{color:var(--text);margin-top:4px;max-width:760px}
.ctx{font-size:12px;color:var(--muted);border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 10px}
/* 第一行：主模块 + 侧栏 */
.row1{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px;align-items:start}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
.card h3{font-size:15px;margin-bottom:10px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card h3 small{font-weight:400;color:var(--muted);font-size:12px}
.side{display:flex;flex-direction:column;gap:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px}.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;font-weight:600}
.next{border-left:3px solid var(--blue2);padding:2px 0 2px 10px;margin-bottom:10px}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:6px 14px;font-size:13px}
.btn.pri{background:var(--blue2);color:#fff;border-color:var(--blue2)}
.list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:13px}
.list li{display:flex;gap:8px;align-items:flex-start}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:var(--bluebg);color:var(--blue2);white-space:nowrap}
.tag.g{background:var(--greenbg);color:var(--green)}.tag.w{background:var(--amberbg);color:#8a5010}.tag.r{background:var(--redbg);color:var(--red)}.tag.n{background:#eef1f5;color:var(--muted)}
/* 三部分卡（总览） */
.parts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.part{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;background:#fff;text-align:left}
.part:hover,.part.on{border-color:var(--blue);background:var(--soft)}
.part.core{border-color:#9fbbe6}
.part .top{display:flex;gap:10px;align-items:center}
.part b{font-size:15px}
.meter{height:8px;background:#eef1f5;border-radius:4px;overflow:hidden}.meter i{display:block;height:100%;background:var(--blue2);border-radius:4px}
/* 详细内容：左对齐的折叠行 */
.sec-title{font-size:13px;color:var(--muted);font-weight:600;margin:4px 2px -4px}
.acc{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.acc details{border-top:1px solid var(--line)}.acc details:first-child{border-top:0}
.acc summary{list-style:none;display:grid;grid-template-columns:minmax(0,1fr) auto 16px;gap:12px;align-items:center;padding:12px 18px;cursor:pointer}
.acc summary::-webkit-details-marker{display:none}
.acc summary b{font-size:14px;font-weight:600}.acc summary span.s{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.acc summary:after{content:"▸";color:var(--muted);transition:transform .15s}
.acc details[open] summary:after{transform:rotate(90deg)}
.acc details[open] summary{background:var(--soft)}
.acc .in{padding:4px 18px 16px;font-size:13px;color:var(--text)}
/* 小图形 */
.waffle{display:grid;grid-template-columns:repeat(32,1fr);gap:3px}.waffle i{aspect-ratio:1;border-radius:3px;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}.legend span{display:inline-flex;gap:5px;align-items:center}.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.gate{display:grid;grid-template-columns:76px 1fr 54px;gap:10px;align-items:center;margin:6px 0}
.gate i{display:block;height:12px;background:#eef1f5;border-radius:6px;overflow:hidden}.gate i b{display:block;height:100%;border-radius:6px}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{min-width:40px;padding:3px 8px;border-radius:8px;border:1px solid var(--line);font-size:12px;text-align:center}
.steps .done{background:var(--blue2);color:#fff;border-color:var(--blue2)}.steps .now{border:2px solid var(--blue2);color:var(--blue2);font-weight:600}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.flow .st{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:4px;position:relative}
.flow .st:not(:last-child):after{content:"→";position:absolute;right:-10px;top:50%;transform:translateY(-50%);color:var(--gray);background:#fff}
.flow b{font-size:18px}
.split{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.tower{display:block;width:100%;max-width:420px;margin:0 auto}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pair div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--soft)}
.status{display:flex;gap:14px;align-items:center}.dot{width:14px;height:14px;border-radius:50%;background:var(--green);box-shadow:0 0 0 5px var(--greenbg);flex:none}
.demo{font-size:11px;color:#8a5010;background:var(--amberbg);padding:1px 6px;border-radius:6px}
.diff{background:#fff;border:1px dashed var(--line2);border-radius:12px;padding:10px 14px;font-size:12px;color:var(--text)}
.diff summary{cursor:pointer;color:var(--muted)}.diff ul{margin:6px 0 0;padding-left:18px}
@media (max-width:900px){
  .row1{grid-template-columns:1fr}.parts,.flow{grid-template-columns:1fr}.flow .st:after{display:none}
  .shell{grid-template-columns:1fr}.rail{flex-direction:row;justify-content:center;border-right:0;border-bottom:1px solid var(--line);padding:6px}.rail .logo{display:none}
  .main{padding:14px 16px 40px}.tabs{padding:0 12px}.waffle{grid-template-columns:repeat(16,1fr)}.pair{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="bar">第三版方案草图 · 结合第一版的信息量与第二版的主次结构 · 数字取自 2026-11-07 本机中心的实际页面</div>
<div class="shell">
  <nav class="rail" id="rail" aria-label="一级导航"></nav>
  <div class="body"><nav class="tabs" id="tabs" aria-label="二级页签"></nav><main class="main" id="main"></main></div>
</div>
<script>
function ring(p, label, size = 64, color = '#183f77') {
  const r = size / 2 - 6, c = 2 * Math.PI * r, v = Math.max(0, Math.min(1, p ?? 0));
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#eef1f5" stroke-width="7"/>${v ? `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${Math.max(c*v,1.5).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})"/>` : ''}<text x="50%" y="53%" text-anchor="middle" dominant-baseline="middle" font-size="${size/4.6}" font-weight="700" fill="#172033">${label}</text></svg>`;
}
const gate = (n, a, d, col) => `<div class="gate"><span>${n}</span><i><b style="width:${a/d*100}%;background:${col}"></b></i><span class="note">${a} / ${d}</span></div>`;
const waffle = () => { let s = '<div class="waffle" role="img" aria-label="128 条规则">'; for (let i = 0; i < 128; i++) s += `<i style="background:${i < 31 ? '#2f8f5b' : i < 125 ? '#c3cbd8' : '#b07d00'}"></i>`; return s + '</div>'; };
function tower() { let s = '<svg class="tower" viewBox="0 0 420 260" role="img" aria-label="层塔（示意，正式页沿用现有 3D 层塔）">';
  for (let l = 0; l < 37; l++) { const y = 236 - l * 5.8, cur = l === 24; s += `<polygon points="110,${y} 240,${y-24} 320,${y} 190,${y+24}" fill="${cur ? '#edf4fd' : '#f8fafc'}" stroke="${cur ? '#d29a00' : '#c3cbd8'}" stroke-width="${cur ? 2 : 1}"/>`; }
  return s + '<text x="328" y="100" font-size="11" fill="#b07d00">B23</text><text x="40" y="244" font-size="11" fill="#68748a">词嵌入</text></svg>'; }
const next = (t, s, b) => `<div class="next"><b>${t}</b><p class="note">${s}</p></div>${b ? `<button class="btn pri">${b}</button>` : ''}`;
const acc = rows => `<p class="sec-title">详细内容</p><div class="acc">${rows.map(([t, s, m, body]) => `<details><summary><div><b>${t}</b><span class="s">${s}</span></div>${m || '<span></span>'}</summary><div class="in">${body || '沿用现有模块的内容。'}</div></details>`).join('')}</div>`;

const LENS = [['route', '进展', '◎'], ['spatial', '空间', '◇'], ['process', '研发', '⌘'], ['config', '配置', '⚙']];
const PAGES = {
 route: [
  { id: 'overview', tab: '总览', title: '我们在破解什么', desc: '大模型怎样用有限的参数学会语言？分三部分：语言里有什么、模型里有什么、两边怎样对应。', ctx: '全部研究 · qwen3-4b bf16',
    main: `<div class="card"><h3>三部分进度 <small>点一张卡看详情</small></h3><div class="parts">
      <button class="part"><span class="note">第一部分</span><div class="top">${ring(.1304, '13%')}<div><b>语言图谱</b><p class="note">9 / 69 项有材料</p></div></div><p class="note">语言里有哪些知识、推理和语法现象</p><p class="note">知识网络 3 / 12 · 推理与功能 3 / 36 · 语法体系 3 / 21</p></button>
      <button class="part core"><span class="note">第三部分 · 主线</span><div class="top">${ring(0, '0/4', 64, '#2a78d6')}<div><b>关联机制</b><p class="note">四组成绩已测</p></div></div><p class="note">语言、风格、逻辑和语法怎样一起决定下一个词</p><p class="note">已登记连接 128 条，连接数只表示登记量</p></button>
      <button class="part"><span class="note">第二部分</span><div class="top">${ring(.0008, '0.08%')}<div><b>LLM 编码图谱</b><p class="note">265 / 350,208 个已检查</p></div></div><p class="note">模型的参数是什么，运行时信息怎样流动</p><p class="note">静态参数和动态机制分别在“空间”查看</p></button>
    </div></div>`,
    side: `<div class="card"><h3>下一步</h3>${next('H3 · 冻结载体与预测规则', '同题比较五种找组件方法，排名进行中', '查看主线')}</div>
      <div class="card"><h3>最近的发现 <small>7 条</small></h3><ul class="list">
        <li><span class="tag">观察</span>范围在第 24–33 层分化，几个注意力头只在“按资料”时读资料色</li>
        <li><span class="tag">观察</span>“现实范围 + 双实体 + 目标在末条”是稳定的行为难点</li>
        <li><span class="tag g">留出</span>排除合理颜色后，中文范围切换在 32 格全部成立</li></ul></div>`,
    rows: [['一个决策点案例', '按资料还是按现实回答颜色：在第几层分开、哪些头在读资料', '', ''], ['关联机制的四组成绩', '新条件预测、全词表分布、干预方向、未见组合', '<span class="tag n">0 / 4 已测</span>'], ['全部发现', '按时间倒序，点开回到证据', '<span class="note">7 条</span>'], ['阶段任务与历史分片', '专业模式', '<span class="tag n">专业</span>'], ['研究归档与原始来源', '专业模式', '<span class="tag n">专业</span>']] },
  { id: 'rules', tab: '成果与证据', title: '成果与证据', desc: '已登记 128 条规则：31 条成立，94 条未成立，3 条待定。未成立的结论能帮后来者少走弯路，所以和成立的放在一起。', ctx: '规则账本',
    main: `<div class="card"><h3>实验查重 <small>先查有没有人做过</small></h3><div style="display:flex;gap:8px"><input style="flex:1;border:1px solid var(--line2);border-radius:8px;padding:7px 10px" placeholder="输入实验、关键词或规则编号"><button class="btn pri">查重</button></div>
      <p class="sec-title" style="margin:14px 0 8px">全部规则</p>${waffle()}<div class="legend"><span><i style="background:#2f8f5b"></i>成立 31</span><span><i style="background:#c3cbd8"></i>未成立 94</span><span><i style="background:#b07d00"></i>待定 3</span><span>点方块看这条规则</span></div></div>`,
    side: `<div class="card"><h3>按对象</h3><dl class="kv"><dt>神经元</dt><dd>26</dd><dt>注意力</dt><dd>29</dd><dt>方法与测量</dt><dd>73</dd></dl></div>
      <div class="card"><h3>按因素 <small>关键词归入，未审定</small></h3><dl class="kv"><dt>逻辑</dt><dd>10</dd><dt>知识与绑定</dt><dd>9</dd><dt>语法</dt><dd>4</dd><dt>语言</dt><dd>2</dd><dt>风格</dt><dd>1</dd></dl></div>`,
    rows: [['有效规则', '有实测支持的规律与方法', '<span class="tag g">31 条</span>'], ['负面规则', '在已测范围内失败的假设与做法', '<span class="tag n">94 条</span>'], ['未决与待验证', '还没有足够证据判定', '<span class="tag w">3 条</span>'], ['核对模型、数据与实验口径', '查重时按哪个模型、数据和协议比较', ''], ['原始报告与版本记录', '按 Phase 与运行 ID 回查', '']] },
 ],
 spatial: [
  { id: 'enc', tab: 'LLM 编码图谱', title: 'LLM 编码图谱 · 结构与参数', desc: '模型里有什么：词嵌入、36 层的注意力头和 MLP 单元。点一层看它的头和单元，再看原生参数与证据。', ctx: '模型 qwen3-4b · bf16',
    main: `<div class="card"><h3>3D 层塔 <small>拖动旋转 · 点一层</small></h3>${tower()}<p class="note" style="text-align:center">正式页沿用现有 3D 层塔；右侧是所选层的详情</p></div>`,
    side: `<div class="card"><h3>B23 · 层结构</h3><dl class="kv"><dt>注意力头</dt><dd>32 个 · 8 组 KV</dd><dt>MLP 单元</dt><dd>9,728 个</dd><dt>已检查单元</dt><dd>—</dd></dl><p class="note" style="margin-top:8px">选一个头或单元，看真实参数、特征、研究证据和历史测试。</p></div>
      <div class="card"><h3>证据阶梯</h3><dl class="kv"><dt>词嵌入</dt><dd>151,936 行</dd><dt>注意力头</dt><dd>1,152 个</dd><dt>MLP 单元</dt><dd>350,208 个</dd><dt>能预测</dt><dd>未测</dd></dl></div>`,
    rows: [['二维列表', '逐层表格，键盘可用', ''], ['证据阶梯明细', '已检查 → 读得出 → 改得动 → 能预测，逐项表格', ''], ['特征基底对比', '原生神经元、字典特征、对照方向分开记录', ''], ['全部研发成果', '3D 总图，按证据来源回查', '']] },
  { id: 'live', tab: '关联机制 · 运行与路径', title: '关联机制 · 运行与路径', desc: '一段文字在各层怎样被读取、改写并决定下一个词。', ctx: 'MA-H2 · 2,520 条',
    main: `<div class="card"><h3>全部层的 3D HiddenState 流 <small>Phase 332 已上线</small></h3><p class="note">保留 Phase 332 的 3D 空间与播放条。下方的六个按钮改成本版的“详细内容”折叠行，和其他页面一致。</p></div>`,
    side: `<div class="card"><h3>本案例要点</h3><ul class="list"><li><span class="tag">观察</span>两种问法在第 24–33 层分开</li><li><span class="tag">观察</span>L29H11、L23H4、L28H0 只在按资料时读资料色</li><li><span class="tag n">待测</span>因果要到 H4 的路径干预</li></ul></div>`,
    rows: [['输入一段文字', '观察 / 对照 / 正式三种运行', ''], ['逐层读出', '资料色 − 常识色，按资料最终 +11.7，按现实 −8.0', ''], ['因素', '5 个因素在目标名位置的逐层差异', '<span class="note">5 个</span>'], ['注意力头', '最看资料颜色的头，候选 · 未干预', '<span class="note">12 个</span>'], ['方法比较', '五种找组件方法同题比较', '<span class="tag w">H3 排名中</span>'], ['更多工具', '反常句草稿、跨族读出、归因演示（教学）', '']] },
  { id: 'resp', tab: '关联机制 · 响应对照', title: '关联机制 · 响应对照', desc: '只改句子里的一处，看模型内部哪里变了。这是连接语言图谱和编码图谱的主要方法。', ctx: '模型 qwen3-4b · bf16',
    main: `<div class="card"><h3>只改一处，看内部哪里变了</h3><div class="steps" style="margin-bottom:10px"><span class="now">疑问与陈述</span><span>否定</span><span>中文与英文</span><span>情感与语气</span></div>
      <div class="pair"><div><span class="note">句子 A</span><p>我想吃，火是热的。</p></div><div><span class="note">句子 B</span><p>我想吃，火是热的吗？</p></div></div>
      <svg viewBox="0 0 640 110" width="100%" role="img" aria-label="逐层差异" style="margin-top:10px">${Array.from({ length: 37 }, (_, i) => { const h = 10 + 76 * Math.exp(-((i - 26) ** 2) / 60); return `<rect x="${10 + i * 17}" y="${96 - h}" width="12" height="${h}" rx="3" fill="#7aa6e0"/>`; }).join('')}<text x="10" y="108" font-size="10" fill="#68748a">词嵌入</text><text x="600" y="108" font-size="10" fill="#68748a">第 36 层</text></svg>

const rail = document.getElementById('rail'), tabs = document.getElementById('tabs'), main = document.getElementById('main');
function render() {

  tabs.innerHTML = PAGES[lens].map(p => `<button data-p="${p.id}" class="${p.id === page ? 'on' : ''}">${p.tab}</button>`).join('');
  tabs.querySelectorAll('button').forEach(b => b.onclick = () => { page = b.dataset.p; render(); });
  const p = PAGES[lens].find(x => x.id === page);
  main.innerHTML = `<div class="head"><div><h2>${p.title}</h2><p>${p.desc}</p></div>${p.ctx ? `<span class="ctx">${p.ctx}</span>` : ''}</div>
    <div class="row1">${p.main}<div class="side">${p.side}</div></div>${acc(p.rows)}
    <details class="diff"><summary>审阅用：与前两版的区别</summary><ul>
      <li>恢复第一版的页面标题和一句说明，用户先知道这一页回答什么问题。</li>
      <li>保留第二版的主次：首屏一个主模块（左，占 2/3），右侧栏只放 2–3 个最常看的要点和一个下一步。</li>

      <li>所有页面同一骨架：标题 → 主模块 + 侧栏 → 详细内容。</li></ul></details>`;
}
