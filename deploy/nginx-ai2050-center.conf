# AI2050 开放平台 nginx 站点：全部请求反代到中心服务 127.0.0.1:5010（中心同源托管客户端与 API）。
# 安装：install_center.sh 把 server_name 换成你的域名后写入 /etc/nginx/conf.d/ai2050-center.conf
# HTTPS：certbot --nginx -d <域名>（certbot 会改写本文件，加入 443 段）

upstream ai2050_center {
    server 127.0.0.1:5010;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name platform.example.org;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 普查分片按 8 MB 分块上传；留余量
    client_max_body_size 16m;

    access_log /var/log/nginx/ai2050-center.access.log;
    error_log  /var/log/nginx/ai2050-center.error.log;

    location /assets/ {
        proxy_pass http://ai2050_center;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://ai2050_center;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;      # 管理端合并普查、首次谱图快照可能较慢
        proxy_send_timeout 900s;
    }
}
