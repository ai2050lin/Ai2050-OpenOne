# AI2050 平台 nginx 站点配置
# 域名：server.ai2050.com
# 作用：静态托管前端 dist + /api 反向代理到本机 FastAPI(:5001) → 同源，无 CORS。
#
# 安装：sudo cp deploy/nginx-ai2050.conf /etc/nginx/conf.d/ai2050.conf
# 依赖：dist 已同步到 /var/www/ai2050（见 install_centos.sh）
#
# 说明：
#   - client_max_body_size 2048m：大 NPZ 原生数组下载走服务端（GET 不受限），
#     但注册/上传类 POST 需要放大，默认 1m 会 413。
#   - /api/ 下的超时放大到 600s：/api/ai-rnd/atlas/registry 等会实时读盘派生。
#   - 未反代的 5002/5003/5004/8000 分片服务不在本部署范围；前端按「未接入」空态显示，
#     不伪造数据（诚实口径）。

upstream ai2050_api {
    server 127.0.0.1:5001;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name server.ai2050.com;

    # ACME 质询（若后续启用 HTTPS 需保留）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 客户端最大上传（注册模板 / 冻结包 / 原生数组）
    client_max_body_size 2048m;

    access_log /var/log/nginx/ai2050.access.log;
    error_log  /var/log/nginx/ai2050.error.log;

    # ── 静态前端 ──────────────────────────────────────────────
    root /var/www/ai2050;
    index index.html;

    # 带 hash 的构建产物可长期缓存（vite 生成的文件名含内容哈希）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /research_data/ {
        expires 1h;
        try_files $uri =404;
    }

    # 单页应用回退（前端用 query 做状态，无需 hash 路由，但保留兜底）
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # ── 中心服务 API 反代 ────────────────────────────────────
    location /api/ {
        proxy_pass http://ai2050_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 30s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
        proxy_buffering off;          # 大数组直传，不落 nginx 缓冲
    }

    # 图谱树 / 注册表等真实数据面端点（前端用绝对路径调用，统一走反代）
    location ~ ^/(docs|openapi\.json|redoc|health|agi|fiber|nfb|snn|toy_experiment|training) {
        proxy_pass http://ai2050_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    # 健康检查（部署脚本用）
    location = /healthz {
        proxy_pass http://ai2050_api/health;
        access_log off;
    }
}
